[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Public service addresses only. Database credentials and JWT secrets stay on Render.
[build.environment]
  VITE_API_URL = "https://jt-nextgen-tech-portal.onrender.com/api"
  # Only authentication is proxied: its host-only refresh cookie belongs to
  # the frontend origin. Other APIs and WebSockets continue going to Render.
  VITE_SOCKET_URL = "https://jt-nextgen-tech-portal.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https://jt-nextgen-tech-portal.onrender.com wss://jt-nextgen-tech-portal.onrender.com; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
